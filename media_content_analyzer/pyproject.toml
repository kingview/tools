[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "media-content-analyzer"
version = "0.10.9"
description = "Contract-first local image, audio, and video understanding tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h2>=4.2,<5",
    "httpx>=0.27,<1",
    "imageio-ffmpeg>=0.6,<1",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
image = [
    "ImageHash>=4.3,<5",
    "opencv-python-headless>=4.10,<5",
]
video = [
    "faster-whisper>=1.1,<2",
    "modelscope>=1.30,<2",
    "scenedetect[opencv]>=0.6.6,<0.7",
]
ocr = [
    "lxml>=6,<7",
    "paddleocr>=3,<4",
    "paddlepaddle>=3.2,<4",
]
desktop = ["pyside6-essentials==6.11.2"]
repair = [
    "onnxruntime>=1.20,<2",
]
repair-nvidia = [
    "onnxruntime-gpu>=1.20,<2",
]
plugin = ["mcp>=1.26,<2", "pyside6-essentials==6.11.2"]
dev = ["pytest>=8.3"]
build = ["pyinstaller>=6.16"]

[project.scripts]
media-content-analyzer = "media_content_analyzer.cli:main"
media-content-analyzer-gui = "media_content_analyzer.desktop:main"
media-watermark-processor = "media_content_analyzer.watermark_cli:main"
media-watermark-processor-gui = "media_content_analyzer.watermark_desktop:main"
video-repair-worker = "media_content_analyzer.video_repair_worker:main"
media-content-analyzer-mcp = "media_content_analyzer.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
