[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "media-content-analyzer"
version = "0.1.0"
description = "Contract-first local image, audio, and video understanding tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "imageio-ffmpeg>=0.6,<1",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
image = [
    "ImageHash>=4.3,<5",
    "opencv-python-headless>=4.10,<5",
]
video = [
    "faster-whisper>=1.1,<2",
    "scenedetect[opencv]>=0.6.6,<0.7",
]
ocr = ["paddleocr>=3,<4"]
dev = ["pytest>=8.3"]

[project.scripts]
media-content-analyzer = "media_content_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
