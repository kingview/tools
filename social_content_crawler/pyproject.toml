[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "social-content-crawler"
version = "0.2.4"
description = "A contract-first social media media downloader powered by yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "playwright>=1.58,<2",
    "pydantic>=2.10,<3",
    "pyside6==6.11.2",
    "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
build = ["pyinstaller>=6.16"]

[project.scripts]
social-content-downloader = "social_content_crawler.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
