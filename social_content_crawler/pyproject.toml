[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "social-content-crawler"
version = "0.9.24"
description = "Contract-first social browsing, downloading, and approved X publishing for local agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "playwright>=1.58,<2",
    "pydantic>=2.10,<3",
    "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
build = ["pyinstaller>=6.16"]
desktop = ["pyside6-essentials==6.11.2"]
plugin = ["mcp>=1.26,<2", "pyside6-essentials==6.11.2"]

[project.scripts]
social-content-downloader = "social_content_crawler.desktop:main"
social-content-crawler-mcp = "social_content_crawler.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
